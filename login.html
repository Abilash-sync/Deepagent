<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Deepagent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .stopwatch-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: white;
        }

        .stopwatch-display {
            font-size: 36px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .stopwatch-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stopwatch-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .stopwatch-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .stopwatch-btn:active {
            transform: scale(0.95);
        }

        .stopwatch-btn.start {
            background: rgba(39, 174, 96, 0.8);
        }

        .stopwatch-btn.start:hover {
            background: rgba(39, 174, 96, 1);
        }

        .stopwatch-btn.stop {
            background: rgba(231, 76, 60, 0.8);
        }

        .stopwatch-btn.stop:hover {
            background: rgba(231, 76, 60, 1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-forgot input[type="checkbox"] {
            cursor: pointer;
            margin-right: 6px;
        }

        .remember-forgot label {
            margin: 0;
            cursor: pointer;
            color: #666;
        }

        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }

        .remember-forgot a:hover {
            color: #764ba2;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: #764ba2;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #27ae60;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Deepagent</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="stopwatch-container">
            <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>
            <div class="stopwatch-controls">
                <button type="button" class="stopwatch-btn start" id="startBtn">Start</button>
                <button type="button" class="stopwatch-btn stop" id="stopBtn">Stop</button>
                <button type="button" class="stopwatch-btn" id="resetBtn">Reset</button>
            </div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                />
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                />
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="remember" />
                    Remember me
                </label>
                <a href="#forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>

            <div class="success-message" id="successMessage">
                Login successful! Redirecting...
            </div>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="#signup">Sign up here</a>
        </div>
    </div>

    <script>
        // Stopwatch functionality
        let stopwatchInterval = null;
        let elapsedTime = 0;

        const stopwatchDisplay = document.getElementById('stopwatchDisplay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startStopwatch() {
            if (stopwatchInterval === null) {
                const startTime = Date.now() - elapsedTime;
                stopwatchInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    stopwatchDisplay.textContent = formatTime(elapsedTime);
                }, 100);
                startBtn.textContent = 'Resume';
            }
        }

        function stopStopwatch() {
            if (stopwatchInterval !== null) {
                clearInterval(stopwatchInterval);
                stopwatchInterval = null;
            }
        }

        function resetStopwatch() {
            stopStopwatch();
            elapsedTime = 0;
            stopwatchDisplay.textContent = '00:00:00';
            startBtn.textContent = 'Start';
        }

        startBtn.addEventListener('click', (e) => {
            e.preventDefault();
            startStopwatch();
        });

        stopBtn.addEventListener('click', (e) => {
            e.preventDefault();
            stopStopwatch();
        });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            resetStopwatch();
        });

        // Login form functionality
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const successMessage = document.getElementById('successMessage');

        // Email validation regex
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function clearErrors() {
            emailError.classList.remove('show');
            passwordError.classList.remove('show');
            successMessage.classList.remove('show');
        }

        function validateEmail(email) {
            return emailRegex.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            clearErrors();

            let isValid = true;

            // Validate email
            if (!emailInput.value.trim()) {
                emailError.textContent = 'Email is required';
                emailError.classList.add('show');
                isValid = false;
            } else if (!validateEmail(emailInput.value)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
                isValid = false;
            }

            // Validate password
            if (!passwordInput.value) {
                passwordError.textContent = 'Password is required';
                passwordError.classList.add('show');
                isValid = false;
            } else if (!validatePassword(passwordInput.value)) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('show');
                isValid = false;
            }

            if (isValid) {
                // Simulate successful login
                successMessage.classList.add('show');
                
                // Here you would normally send credentials to backend
                console.log('Login attempt:', {
                    email: emailInput.value,
                    password: '***',
                    rememberMe: document.querySelector('input[name="remember"]').checked
                });

                // Reset form after 2 seconds
                setTimeout(() => {
                    loginForm.reset();
                    clearErrors();
                }, 2000);
            }
        });

        // Clear error when user starts typing
        emailInput.addEventListener('input', function () {
            if (emailError.classList.contains('show')) {
                emailError.classList.remove('show');
            }
        });

        passwordInput.addEventListener('input', function () {
            if (passwordError.classList.contains('show')) {
                passwordError.classList.remove('show');
            }
        });
    </script>
</body>
</html>
